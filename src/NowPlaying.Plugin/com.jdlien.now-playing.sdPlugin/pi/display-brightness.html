<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Display Brightness</title>
  <script src="sdpi-components.js"></script>
</head>
<body>
  <sdpi-item label="Step per click">
    <sdpi-select setting="step" default="2">
      <option value="1">1%</option>
      <option value="2">2%</option>
      <option value="5">5%</option>
      <option value="10">10%</option>
    </sdpi-select>
  </sdpi-item>

  <sdpi-item label="">
    <small>Controls the primary monitor's brightness over DDC/CI, the same channel the monitor's own menu uses. Turn to adjust; press the dial or tap the strip to dim to the monitor's minimum and back. If nothing happens, enable DDC/CI in the monitor's menu; HDR mode may also lock brightness on some monitors.</small>
  </sdpi-item>
</body>
</html>
