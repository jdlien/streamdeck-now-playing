<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Brightness</title>
  <script src="sdpi-components.js"></script>
</head>
<body>
  <sdpi-item label="Step per click">
    <sdpi-select setting="step" default="5">
      <option value="1">1%</option>
      <option value="2">2%</option>
      <option value="5">5%</option>
      <option value="10">10%</option>
    </sdpi-select>
  </sdpi-item>

  <sdpi-item label="">
    <small>Turn to set the Stream Deck's screen brightness; press the dial or tap the strip to switch it off and back. The device cannot report its brightness, so the level shown is the last one set here; the Stream Deck app's own brightness setting and screen saver still work independently.</small>
  </sdpi-item>
</body>
</html>
