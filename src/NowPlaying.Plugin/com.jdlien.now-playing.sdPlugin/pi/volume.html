<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Volume</title>
  <script src="sdpi-components.js"></script>
</head>
<body>
  <sdpi-item label="Step per click">
    <sdpi-select setting="step" default="2">
      <option value="1">1%</option>
      <option value="2">2%</option>
      <option value="5">5%</option>
      <option value="10">10%</option>
    </sdpi-select>
  </sdpi-item>

  <sdpi-item label="">
    <small>Turn to change the volume of the default output device; press the dial or tap the strip to mute. Follows the device Windows currently uses for playback.</small>
  </sdpi-item>
</body>
</html>
